<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Marta &amp; Pietro | 25.06.2027</title>


<style>

/* =========================================
   PAGINA
   ========================================= */

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    background: #f8f6f0;

}


body {

    display: flex;

    justify-content: center;

    align-items: flex-start;

}


/* =========================================
   CONTENITORE DELL'IMMAGINE
   ========================================= */

.page {

    position: relative;

    width: 100%;

    max-width: 900px;

    line-height: 0;

}


.page img {

    display: block;

    width: 100%;

    height: auto;

}


/* =========================================
   RIQUADRO INTERAMENTE CLICCABILE
   ========================================= */

#uploadButton {

    position: absolute;


    /*
       POSIZIONE DEL RIQUADRO
    */

    left: 11.5%;

    top: 55%;


    /*
       DIMENSIONI DEL RIQUADRO
    */

    width: 77%;

    height: 25%;


    /*
       IL PULSANTE È INVISIBILE
    */

    border: none;

    background: transparent;


    cursor: pointer;

    padding: 0;

    margin: 0;


    z-index: 10;

}


/*
   Piccolo effetto quando si passa
   sopra il riquadro
*/

#uploadButton:hover {

    background: rgba(255,255,255,0.04);

}


/*
   Nessun bordo blu quando viene
   selezionato
*/

#uploadButton:focus {

    outline: none;

}


/* =========================================
   MESSAGGIO DI CONFERMA
   ========================================= */

#status {

    position: fixed;

    left: 50%;

    bottom: 20px;

    transform: translateX(-50%);


    background: white;

    color: #52604c;


    padding: 11px 20px;

    border-radius: 25px;


    font-family: Arial, sans-serif;

    font-size: 14px;


    box-shadow:
        0 4px 15px rgba(0,0,0,0.15);


    display: none;


    z-index: 9999;

}


/* =========================================
   TELEFONO
   ========================================= */

@media (max-width: 600px) {

    #uploadButton {

        left: 11.5%;

        top: 55%;

        width: 77%;

        height: 25%;

    }

}

</style>

</head>


<body>


<!-- ======================================
     PAGINA DEL MATRIMONIO
     ====================================== -->

<div class="page">


    <!--

        IMPORTANTE:

        L'immagine deve chiamarsi:

        matrimonio.png

        e deve essere nello stesso
        repository di index.html.

    -->

    <img

        src="matrimonio.png"

        alt="Marta e Pietro - Condivisione foto matrimonio"

    >



    <!-- ==================================
         RIQUADRO CLICCABILE
         ================================== -->

    <button

        id="uploadButton"

        aria-label="Carica le tue foto"

        type="button">

    </button>


</div>



<!-- ======================================
     MESSAGGIO
     ====================================== -->

<div id="status"></div>



<!-- ======================================
     CLOUDINARY
     ====================================== -->

<script

    src="https://upload-widget.cloudinary.com/global/all.js"

    type="text/javascript">

</script>



<script>

/* =========================================
   DATI CLOUDINARY
   ========================================= */

const CLOUD_NAME =
    "sddyugpi";


const UPLOAD_PRESET =
    "MATRIMONIO MARTA e PIETRO";


/* =========================================
   MESSAGGIO
   ========================================= */

const statusBox =
    document.getElementById("status");



/* =========================================
   CREAZIONE WIDGET CLOUDINARY
   ========================================= */

const widget =

cloudinary.createUploadWidget(

{

    cloudName:
        CLOUD_NAME,


    uploadPreset:
        UPLOAD_PRESET,


    /*
       Cartella dove verranno salvate
       le foto
    */

    folder:
        "Matrimonio_Marta_Pietro_25-06-2027",


    /*
       Più file contemporaneamente
    */

    multiple:
        true,


    maxFiles:
        50,


    /*
       Sorgenti disponibili
    */

    sources:
        [
            "local",
            "camera"
        ],


    /*
       Formati accettati
    */

    clientAllowedFormats:
        [
            "jpg",
            "jpeg",
            "png",
            "webp",
            "heic",
            "mp4",
            "mov"
        ],


    /*
       Dimensione massima
       15 MB per file
    */

    maxFileSize:
        15000000,


    showCompletedButton:
        true,


    /*
       Italiano
    */

    language:
        "it",


    /*
       Traduzioni Cloudinary
    */

    text:
    {

        it:
        {

            menu:
            {

                files:
                    "Scegli foto e video",

                camera:
                    "Fotocamera"

            },


            local:
            {

                browse:
                    "Scegli foto e video",

                dd_title_single:
                    "Trascina qui il file",

                dd_title_multi:
                    "Trascina qui i file",

                or:
                    "oppure"

            },


            queue:
            {

                title:
                    "File da caricare",

                title_uploading_with_counter:
                    "Caricamento di {{current}} di {{total}}",

                done:
                    "Completato",

                upload_more:
                    "Aggiungi altri file",

                retry_upload:
                    "Riprova",

                cancel_upload:
                    "Annulla",

                remove:
                    "Rimuovi"

            },


            buttons:
            {

                upload:
                    "Carica foto",

                upload_more:
                    "Aggiungi altri file",

                cancel:
                    "Annulla",

                close:
                    "Chiudi"

            },


            notifications:
            {

                general_error:
                    "Si è verificato un errore. Riprova.",

                upload_failed:
                    "Caricamento non riuscito.",

                upload_complete:
                    "Foto caricata con successo!"

            }

        }

    }

},


/* =========================================
   RISULTATI DEL CARICAMENTO
   ========================================= */

function(error, result)
{

    /*
       Errore
    */

    if (error)
    {

        statusBox.innerText =
            "Si è verificato un errore. Riprova.";


        statusBox.style.display =
            "block";


        setTimeout(function()
        {

            statusBox.style.display =
                "none";

        }, 3000);


        return;

    }


    /*
       Foto caricata
    */

    if
    (
        result &&
        result.event === "success"
    )
    {

        statusBox.innerText =
            "✓ Foto caricata con successo!";


        statusBox.style.display =
            "block";


        setTimeout(function()
        {

            statusBox.style.display =
                "none";

        }, 2500);

    }

});



/* =========================================
   APERTURA CLOUDINARY
   ========================================= */

document

    .getElementById("uploadButton")

    .addEventListener(

        "click",

        function()
        {

            /*
               Apre Cloudinary
            */

            widget.open();

        }

    );

</script>


</body>

</html>
