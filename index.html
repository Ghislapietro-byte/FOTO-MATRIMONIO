<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Marta & Pietro | 25.06.2027</title>


<style>

/* =========================================
   PAGINA
   ========================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;

    background: #f8f6f0;

}


/* =========================================
   IMMAGINE INIZIALE
   ========================================= */

.page {

    position: relative;

    width: 100%;

    margin: 0;
    padding: 0;

    line-height: 0;

}


.page img {

    display: block;

    width: 100%;

    height: auto;

}


/* =========================================
   RIQUADRO CARICA LE TUE FOTO

   TUTTO IL RIQUADRO È CLICCABILE
   ========================================= */

#uploadButton {

    position: absolute;

    left: 10.5%;

    top: 52.5%;

    width: 79%;

    height: 31%;

    border: none;

    background: transparent;

    cursor: pointer;

    padding: 0;

    margin: 0;

    z-index: 10;

}


/* =========================================
   GALLERIA
   ========================================= */

.gallery-section {

    width: 100%;

    padding: 55px 18px 70px;

    background: #f8f6f0;

    text-align: center;

    box-sizing: border-box;

}


.gallery-title {

    margin: 0 0 12px;

    color: #30382f;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 30px;

    font-weight: normal;

    letter-spacing: 2px;

    line-height: 1.3;

}


.gallery-subtitle {

    margin: 0 auto 35px;

    max-width: 650px;

    color: #454a43;

    font-family:
        Arial,
        sans-serif;

    font-size: 16px;

    line-height: 1.7;

}


/* =========================================
   GRIGLIA FOTO
   ========================================= */

.gallery {

    width: 100%;

    max-width: 1100px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

}


.gallery-item {

    position: relative;

    overflow: hidden;

    border-radius: 8px;

    background: #e9e7df;

    aspect-ratio: 1 / 1;

    cursor: pointer;

}


.gallery-item img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

    transition:
        transform 0.3s ease;

}


.gallery-item:hover img {

    transform: scale(1.04);

}


/* =========================================
   MESSAGGIO GALLERIA
   ========================================= */

.gallery-message {

    width: 100%;

    grid-column: 1 / -1;

    padding: 30px 15px;

    color: #666b63;

    font-family: Arial, sans-serif;

    font-size: 15px;

    line-height: 1.6;

}


/* =========================================
   FOTO A TUTTO SCHERMO
   ========================================= */

.lightbox {

    display: none;

    position: fixed;

    z-index: 9999;

    left: 0;

    top: 0;

    width: 100%;

    height: 100%;

    background:
        rgba(0,0,0,0.90);

    justify-content: center;

    align-items: center;

    padding: 20px;

    box-sizing: border-box;

}


.lightbox.active {

    display: flex;

}


.lightbox img {

    max-width: 95%;

    max-height: 90%;

    object-fit: contain;

}


.close-lightbox {

    position: absolute;

    top: 15px;

    right: 22px;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 40px;

    cursor: pointer;

    line-height: 1;

}


/* =========================================
   MESSAGGIO UPLOAD
   ========================================= */

#status {

    position: fixed;

    left: 50%;

    bottom: 20px;

    transform:
        translateX(-50%);

    background: white;

    color: #52604c;

    padding: 11px 20px;

    border-radius: 25px;

    font-family: Arial, sans-serif;

    font-size: 14px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.15);

    display: none;

    z-index: 99999;

}


/* =========================================
   SMARTPHONE
   ========================================= */

@media (max-width: 600px) {

    .gallery-section {

        padding:
            45px 10px 60px;

    }


    .gallery-title {

        font-size: 24px;

        letter-spacing: 1.5px;

    }


    .gallery-subtitle {

        font-size: 15px;

    }


    .gallery {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 8px;

    }

}

</style>

</head>


<body>


<!-- ======================================
     IMMAGINE INIZIALE
     ====================================== -->

<div class="page">

    <img
        src="matrimonio.png"
        alt="Marta e Pietro - 25 giugno 2027"
    >


    <!--
       TUTTO IL RIQUADRO DELLA TUA IMMAGINE
       È CLICCABILE
    -->

    <button
        id="uploadButton"
        type="button"
        aria-label="Carica le tue foto">
    </button>

</div>



<!-- ======================================
     GALLERIA
     ====================================== -->

<section class="gallery-section">

    <h2 class="gallery-title">
        LE FOTO DEL NOSTRO GIORNO ❤️
    </h2>


    <p class="gallery-subtitle">

        Scopri i momenti più belli
        condivisi dai nostri invitati.
        <br>

        Hai scattato una foto?
        Condividila anche tu!

    </p>


    <div
        id="gallery"
        class="gallery">

        <div
            class="gallery-message"
            id="galleryMessage">

            Caricamento delle foto...

        </div>

    </div>

</section>



<!-- ======================================
     FOTO GRANDE
     ====================================== -->

<div
    id="lightbox"
    class="lightbox">

    <span
        id="closeLightbox"
        class="close-lightbox">

        ×

    </span>


    <img
        id="lightboxImage"
        src=""
        alt="Foto del matrimonio">

</div>



<!-- ======================================
     MESSAGGIO
     ====================================== -->

<div id="status"></div>



<!-- ======================================
     CLOUDINARY
     ====================================== -->

<script
    src="https://upload-widget.cloudinary.com/global/all.js"
    type="text/javascript">
</script>



<script>

/* =========================================
   DATI CLOUDINARY
   ========================================= */

const CLOUD_NAME =
    "sddyugpi";


const UPLOAD_PRESET =
    "MATRIMONIO MARTA e PIETRO";


const GALLERY_TAG =
    "matrimonio-marta-pietro";


/* =========================================
   ELEMENTI
   ========================================= */

const uploadButton =
    document.getElementById(
        "uploadButton"
    );


const statusBox =
    document.getElementById(
        "status"
    );


const gallery =
    document.getElementById(
        "gallery"
    );



/* =========================================
   WIDGET CLOUDINARY
   ========================================= */

const widget =

cloudinary.createUploadWidget(

{

    cloudName:
        CLOUD_NAME,


    uploadPreset:
        UPLOAD_PRESET,


    folder:
        "Matrimonio_Marta_Pietro_25-06-2027",


    /*
       TAG DELLE FOTO
    */

    tags:
        [
            GALLERY_TAG
        ],


    multiple:
        true,


    maxFiles:
        50,


    sources:
        [
            "local",
            "camera"
        ],


    /*
       FORMATI ACCETTATI
    */

    clientAllowedFormats:
        [
            "jpg",
            "jpeg",
            "png",
            "webp",
            "heic",
            "mp4",
            "mov"
        ],


    /*
       MASSIMO 50 MB PER FILE
    */

    maxFileSize:
        50000000,


    showCompletedButton:
        true,


    language:
        "it",


    /*
       TRADUZIONI
    */

    text:
    {

        it:
        {

            menu:
            {

                files:
                    "Scegli foto e video",

                camera:
                    "Fotocamera"

            },


            local:
            {

                browse:
                    "Scegli foto e video",

                dd_title_single:
                    "Trascina qui il file",

                dd_title_multi:
                    "Trascina qui i file",

                or:
                    "oppure"

            },


            queue:
            {

                title:
                    "File da caricare",

                title_uploading_with_counter:
                    "Caricamento di {{current}} di {{total}}",

                done:
                    "Completato",

                upload_more:
                    "Aggiungi altri file",

                retry_upload:
                    "Riprova",

                cancel_upload:
                    "Annulla",

                remove:
                    "Rimuovi"

            },


            buttons:
            {

                upload:
                    "Carica",

                upload_more:
                    "Aggiungi altri file",

                cancel:
                    "Annulla",

                close:
                    "Chiudi"

            },


            notifications:
            {

                general_error:
                    "Si è verificato un errore. Riprova.",

                upload_failed:
                    "Caricamento non riuscito.",

                upload_complete:
                    "Foto caricata con successo!"

            }

        }

    }

},


/* =========================================
   RISULTATO UPLOAD
   ========================================= */

function(error, result)
{

    if (error)
    {

        mostraMessaggio(
            "Si è verificato un errore. Riprova."
        );

        return;

    }


    if
    (
        result &&
        result.event === "success"
    )
    {

        mostraMessaggio(
            "✓ Foto caricata con successo!"
        );


        /*
           Aspetta qualche secondo
           e aggiorna la galleria.
        */

        setTimeout(
            caricaGalleria,
            3000
        );

    }

});



/* =========================================
   APRI UPLOAD
   ========================================= */

uploadButton.addEventListener(

    "click",

    function()
    {

        widget.open();

    }

);



/* =========================================
   MESSAGGIO
   ========================================= */

function mostraMessaggio(
    testo
)
{

    statusBox.innerText =
        testo;


    statusBox.style.display =
        "block";


    setTimeout(

        function()
        {

            statusBox.style.display =
                "none";

        },

        3000

    );

}



/* =========================================
   CARICA LE FOTO DALLA RESOURCE LIST
   ========================================= */

function caricaGalleria()
{

    const url =

        "https://res.cloudinary.com/"
        +
        CLOUD_NAME
        +
        "/image/list/"
        +
        GALLERY_TAG
        +
        ".json";


    fetch(url)

    .then(

        function(response)
        {

            if (!response.ok)
            {

                throw new Error(
                    "Resource List non disponibile"
                );

            }


            return response.json();

        }

    )

    .then(

        function(data)
        {

            gallery.innerHTML = "";


            /*
               NESSUNA FOTO
            */

            if
            (
                !data.resources ||
                data.resources.length === 0
            )
            {

                gallery.innerHTML =

                    '<div class="gallery-message">'
                    +
                    'Ancora nessuna foto. '
                    +
                    'Sii il primo a condividerne una! ❤️'
                    +
                    '</div>';

                return;

            }


            /*
               CREA LE FOTO
            */

            data.resources.forEach(

                function(asset)
                {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "gallery-item";


                    const image =
                        document.createElement(
                            "img"
                        );


                    image.loading =
                        "lazy";


                    image.alt =
                        "Foto del matrimonio";


                    /*
                       URL OTTIMIZZATO CLOUDINARY
                    */

                    image.src =

                        "https://res.cloudinary.com/"
                        +
                        CLOUD_NAME
                        +
                        "/image/upload/"
                        +
                        "f_auto,q_auto,w_800,c_fill/"
                        +
                        asset.public_id
                        +
                        "."
                        +
                        asset.format;


                    item.appendChild(
                        image
                    );


                    /*
                       CLICCANDO SULLA FOTO
                       SI APRE GRANDE
                    */

                    item.addEventListener(

                        "click",

                        function()
                        {

                            apriFoto(
                                image.src
                            );

                        }

                    );


                    gallery.appendChild(
                        item
                    );

                }

            );

        }

    )

    .catch(

        function(error)
        {

            console.log(
                "Errore galleria:",
                error
            );


            gallery.innerHTML =

                '<div class="gallery-message">'
                +
                'La galleria non è momentaneamente '
                +
                'disponibile. Riprova più tardi. ❤️'
                +
                '</div>';

        }

    );

}



/* =========================================
   APRI FOTO GRANDE
   ========================================= */

function apriFoto(url)
{

    const lightbox =
        document.getElementById(
            "lightbox"
        );


    const lightboxImage =
        document.getElementById(
            "lightboxImage"
        );


    lightboxImage.src =
        url;


    lightbox.classList.add(
        "active"
    );

}



/* =========================================
   CHIUDI FOTO
   ========================================= */

document

    .getElementById(
        "closeLightbox"
    )

    .addEventListener(

        "click",

        function()
        {

            document
                .getElementById(
                    "lightbox"
                )
                .classList.remove(
                    "active"
                );

        }

    );



/* =========================================
   CHIUDI CLICCANDO FUORI DALLA FOTO
   ========================================= */

document

    .getElementById(
        "lightbox"
    )

    .addEventListener(

        "click",

        function(event)
        {

            if
            (
                event.target === this
            )
            {

                this.classList.remove(
                    "active"
                );

            }

        }

    );



/* =========================================
   CARICA LA GALLERIA ALL'APERTURA
   ========================================= */

caricaGalleria();


/*
   Aggiornamento automatico
   ogni 60 secondi.
*/

setInterval(

    caricaGalleria,

    60000

);

</script>


</body>

</html>
